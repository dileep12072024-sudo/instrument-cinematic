  <body><noscript><main><h1>IST: Department of Instrument Technology, Andhra University</h1><p>The Department of Instrument Technology (IST), AU College of Engineering (A), Andhra University, Visakhapatnam, has taught measurement and instrumentation since 1937.</p><h2>Programmes</h2><ul><li>B.Tech, Instrumentation Engineering</li><li>M.Tech, Instrumentation and Control</li><li>Ph.D, Instrument Technology</li></ul><h2>Laboratories</h2><p>Process Control, DCS, Industrial Instruments, Sensors and Transducers, Control Systems, Machines, Simulation, Measurements, Device Fabrication and Biomedical Instrumentation laboratories.</p><p>This site is a 3D walk through the department; please enable JavaScript to explore it, or read <a href="/about/">about the department</a>.</p></main></noscript><!-- the loading screen, painted before any script loads (src/loader3d.js) --><div class="l3d arch" id="l3d" role="status" aria-label="Loading the department"><div class="l3d-brand"><b>Instrument Technology</b><i>Andhra University</i></div><p class="l3d-status">Preparing the department</p><div class="l3d-stage" aria-hidden="true"><div class="l3d-group"><div class="l3d-spin"><b class="l3d-slot" style="--k:0;--sx:0%;--sy:0%"><i class="l3d-tile"></i></b><b class="l3d-slot" style="--k:1;--sx:33.3333%;--sy:0%"><i class="l3d-tile"></i></b><b class="l3d-slot" style="--k:2;--sx:66.6667%;--sy:0%"><i class="l3d-tile"></i></b><b class="l3d-slot" style="--k:3;--sx:100%;--sy:0%"><i class="l3d-tile"></i></b><b class="l3d-slot" style="--k:4;--sx:0%;--sy:33.3333%"><i class="l3d-tile"></i></b><b class="l3d-slot" style="--k:5;--sx:33.3333%;--sy:33.3333%"><i class="l3d-tile"></i></b><b class="l3d-slot" style="--k:6;--sx:66.6667%;--sy:33.3333%"><i class="l3d-tile"></i></b><b class="l3d-slot" style="--k:7;--sx:100%;--sy:33.3333%"><i class="l3d-tile"></i></b><b class="l3d-slot" style="--k:8;--sx:0%;--sy:66.6667%"><i class="l3d-tile"></i></b><b class="l3d-slot" style="--k:9;--sx:33.3333%;--sy:66.6667%"><i cla
